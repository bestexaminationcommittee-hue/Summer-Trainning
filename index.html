<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی قوتابیان - ئامادەبوون و لۆکەیشن</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet OpenStreetMap CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs (v9.23.0 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        #map { height: 420px; width: 100%; border-radius: 1rem; z-index: 1; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- SECTION 1: LOGIN PAGE -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-purple-50">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-2">
                    🎓
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">سیستەمی قوتابیان</h1>
                <p class="text-sm text-slate-500">تکایە ئیمێڵ و پاسۆردەکەت بنووسە</p>
            </div>

            <div id="loginAlert" class="hidden p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ئیمێڵ (Email)</label>
                    <input type="email" id="email" required placeholder="muhammed@best.inst.com" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-left">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">تێپەڕەواشە (Password)</label>
                    <input type="password" id="password" required placeholder="••••••••" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-left">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-indigo-100 flex items-center justify-center space-x-2 space-x-reverse">
                    <span>چوونەژوورەوە</span>
                </button>
            </form>
        </div>
    </div>

    <!-- SECTION 2: CHECKIN PAGE / DASHBOARD -->
    <div id="appSection" class="hidden min-h-screen">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">
                        🎓
                    </div>
                    <div>
                        <h1 class="font-bold text-slate-900 leading-none">سیستەمی قوتابیان</h1>
                        <span class="text-xs text-slate-500">پشکنین و لۆکەیشنی ڕاستەوخۆ</span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4 space-x-reverse">
                    <span id="userEmailDisplay" class="text-sm font-medium text-slate-600 dir-ltr"></span>
                    <button id="logoutBtn" class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition">
                        دەرچوون
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            
            <!-- Info Header -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 mb-1">بارودۆخی یوزەر</h2>
                    <p id="statusTimeText" class="text-xs text-slate-500">کاتی ئۆنلاینبوون: لەگەڕاندایە...</p>
                </div>
                <div id="statusBadge" class="px-4 py-2 rounded-xl text-xs font-bold bg-green-50 text-green-700">
                    🟢 ئۆنلاینە
                </div>
            </div>

            <!-- Live Map Box -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        📍 لۆکەیشنی ڕاستەوخۆ لەسەر نەخشە
                    </h3>
                    <span id="locationCoords" class="text-xs font-mono text-slate-500">لەگەڕاندایە...</span>
                </div>
                <div id="map"></div>
            </div>

        </main>
    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOXm78zILvHZ9tA8fhpbHHOmpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034570",
            appId: "1:1064679034570:web:f334161e9e6a2b11a6ee33",
            measurementId: "G-CGHQW9Z88Q"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let map = null;
        let userMarker = null;
        let locationWatchId = null;

        const loginSection = document.getElementById('loginSection');
        const appSection = document.getElementById('appSection');
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const submitBtn = document.getElementById('submitBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const statusTimeText = document.getElementById('statusTimeText');
        const locationCoords = document.getElementById('locationCoords');

        function showLoginAlert(message, isError = true) {
            loginAlert.textContent = message;
            loginAlert.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            loginAlert.classList.add(isError ? 'bg-red-50' : 'bg-green-50', isError ? 'text-red-600' : 'text-green-600');
        }

        // Auth Listener
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loginSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;

                initializeSession();
            } else {
                currentUser = null;
                appSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
                stopLocationTracking();
            }
        });

        // Login Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>تکایە چاوەڕێ بکە...</span>';

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                showLoginAlert('ئیمێڵ یان تێپەڕەواشە هەڵەیە!', true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>چوونەژوورەوە</span>';
            }
        });

        // Logout Event
        logoutBtn.addEventListener('click', async () => {
            if (currentUser) {
                // Update Firestore before logout
                await db.collection('checkins').doc(currentUser.uid).set({
                    isOnline: false,
                    lastOfflineTime: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }
            auth.signOut();
        });

        // INITIALIZE MAP & LOCATIONS
        async function initializeSession() {
            const loginTime = new Date();
            statusTimeText.textContent = `کاتی ئۆنلاینبوون: ${loginTime.toLocaleTimeString('en-US')} (${loginTime.toLocaleDateString()})`;

            // 1. Update Firestore status (Online)
            await db.collection('checkins').doc(currentUser.uid).set({
                email: currentUser.email,
                isOnline: true,
                lastOnlineTime: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            // 2. Init Map
            initMap();

            // 3. Track Live Location
            startLiveLocationTracking();
        }

        function initMap() {
            if (!map) {
                map = L.map('map').setView([36.1912, 44.0091], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            }
        }

        function startLiveLocationTracking() {
            if (navigator.geolocation) {
                locationWatchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    locationCoords.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

                    const latlng = [lat, lng];

                    // Display User Name / Email on the map marker
                    if (!userMarker) {
                        userMarker = L.marker(latlng).addTo(map)
                            .bindPopup(`<b>${currentUser.email}</b><br>ئێستا لێرەیە`)
                            .openPopup();
                    } else {
                        userMarker.setLatLng(latlng);
                    }
                    map.setView(latlng, 16);

                    // Update Live Location to Firestore
                    db.collection('checkins').doc(currentUser.uid).set({
                        email: currentUser.email,
                        location: new firebase.firestore.GeoPoint(lat, lng),
                        lastLocationUpdate: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                }, (err) => {
                    console.warn("Geolocation error:", err);
                    locationCoords.textContent = "کێشە لە ڕێگەپێدانی لۆکەیشن!";
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                });
            }
        }

        function stopLocationTracking() {
            if (locationWatchId) {
                navigator.geolocation.clearWatch(locationWatchId);
            }
        }
    </script>
</body>
</html>
