<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی قوتابیان - ئامادەبوون</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (v9.23.0 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- SECTION 1: LOGIN PAGE -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-purple-50">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">سیستەمی قوتابیان</h1>
                <p class="text-sm text-slate-500">تکایە ئیمێڵ و پاسۆردەکەت بنووسە</p>
            </div>

            <div id="loginAlert" class="hidden p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ئیمێڵ (Email)</label>
                    <input type="email" id="email" required placeholder="muhammed@best.com" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-left">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">تێپەڕەواشە (Password)</label>
                    <input type="password" id="password" required placeholder="••••••••" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-left">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-indigo-100 flex items-center justify-center space-x-2 space-x-reverse">
                    <span>چوونەژوورەوە</span>
                </button>
            </form>
        </div>
    </div>

    <!-- SECTION 2: CHECKIN PAGE (داشبۆرد) -->
    <div id="appSection" class="hidden min-h-screen">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
                        🎓
                    </div>
                    <div>
                        <h1 class="font-bold text-slate-900 leading-none">سیستەمی قوتابیان</h1>
                        <span class="text-xs text-slate-500">تۆمارکردنی ئامادەبوون</span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4 space-x-reverse">
                    <span id="userEmailDisplay" class="text-sm font-medium text-slate-600 dir-ltr"></span>
                    <button id="logoutBtn" class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition">
                        دەرچوون
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 mb-1">بەخێربێیت بۆ بەشی پشکنین</h2>
                    <p class="text-sm text-slate-500">لە ڕێگەی ئەم لاپەڕەیەوە دەتوانیت بارودۆخی ئامادەبوون تۆمار بکەیت.</p>
                </div>
                <div class="px-4 py-2 rounded-xl text-sm font-bold bg-indigo-50 text-indigo-700">
                    سیستەم چالاکە
                </div>
            </div>
        </main>
    </div>

    <!-- FIREBASE & SCRIPT LOGIC -->
    <script>
        // کلیلە ڕاستەقینەکانی فایەربەیسەکەت
        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOXm78zILvHZ9tA8fhpbHHOmpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034570",
            appId: "1:1064679034570:web:f334161e9e6a2b11a6ee33",
            measurementId: "G-CGHQW9Z88Q"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const loginSection = document.getElementById('loginSection');
        const appSection = document.getElementById('appSection');
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const submitBtn = document.getElementById('submitBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const logoutBtn = document.getElementById('logoutBtn');

        function showLoginAlert(message, isError = true) {
            loginAlert.textContent = message;
            loginAlert.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (isError) {
                loginAlert.classList.add('bg-red-50', 'text-red-600');
            } else {
                loginAlert.classList.add('bg-green-50', 'text-green-600');
            }
        }

        // پشکنینی باری چوونەژوورەوە
        auth.onAuthStateChanged((user) => {
            if (user) {
                loginSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
            } else {
                appSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            }
        });

        // هاندلەری لۆگین
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>تکایە چاوەڕێ بکە...</span>';

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                console.error("Firebase Error:", error);
                let errorMessage = `خەتا: (${error.code})`;
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMessage = 'ئیمێڵ یان تێپەڕەواشە هەڵەیە!';
                }
                showLoginAlert(errorMessage, true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>چوونەژوورەوە</span>';
            }
        });

        // هاندلەری دەرچوون
        logoutBtn.addEventListener('click', () => {
            auth.signOut();
        });
    </script>
</body>
</html>
