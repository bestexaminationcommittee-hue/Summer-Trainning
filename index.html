<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی ئامادەبوونی قوتابیان</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet OpenStreetMap CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs (v9.23.0 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        #map { height: 550px; width: 100%; border-radius: 1rem; z-index: 1; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- 1. LOGIN PAGE -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-2 text-2xl">
                    🎓
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">سیستەمی بەڕێوەبردن</h1>
                <p class="text-sm text-slate-500">تکایە چوونەژوورەوە ئەنجام بدە</p>
            </div>

            <div id="loginAlert" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ئیمێڵ (Email)</label>
                    <input type="email" id="email" required placeholder="admin@best.inst.com" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-left">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">تێپەڕەواشە (Password)</label>
                    <input type="password" id="password" required placeholder="••••••••" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-left">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg">
                    چوونەژوورەوە
                </button>
            </form>
        </div>
    </div>

    <!-- 2. MAIN APP CONTAINER (SHARED HEADER) -->
    <div id="appContainer" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <span class="text-2xl">📍</span>
                    <h1 class="font-bold text-lg text-slate-800">داشبۆردی سەرپەرشتیار (لایڤ ماپ و ئامادەبوون)</h1>
                </div>
                <div class="flex items-center space-x-4 space-x-reverse">
                    <span id="userEmailDisplay" class="text-sm font-medium text-slate-600 dir-ltr"></span>
                    <button id="logoutBtn" class="px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition">
                        دەرچوون
                    </button>
                </div>
            </div>
        </header>

        <!-- ADMIN DASHBOARD CONTENT -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                <!-- Left Column: Student List & Live Status -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 lg:col-span-1">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="font-bold text-slate-800 text-sm">👥 قوتابییە تۆمارکراوەکان</h3>
                        <span id="studentCount" class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-bold">0</span>
                    </div>
                    
                    <div id="studentListContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-400 text-center py-6">چاوەڕوانی چالاکبوون...</p>
                    </div>
                </div>

                <!-- Right Column: Live Map -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3 lg:col-span-3">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="font-bold text-slate-800 text-sm">🗺️ نەخشەی ڕاستەوخۆی لۆکەیشنی قوتابیان</h3>
                        <span class="text-xs text-emerald-600 font-bold bg-emerald-50 px-3 py-1 rounded-full">● Live Tracking</span>
                    </div>
                    <div id="map"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script>
        const ADMIN_EMAIL = "admin@best.inst.com"; // ئیمێڵی ئەدمینەکەت لێرە دڵنیا ببەرەوە

        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOXm78zILvHZ9tA8fhpbHHOmpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034570",
            appId: "1:1064679034570:web:f334161e9e6a2b11a6ee33",
            measurementId: "G-CGHQW9Z88Q"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let map = null;
        let markersMap = {};

        const loginSection = document.getElementById('loginSection');
        const appContainer = document.getElementById('appContainer');
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const submitBtn = document.getElementById('submitBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const studentListContainer = document.getElementById('studentListContainer');
        const studentCount = document.getElementById('studentCount');

        // Auth State Observer
        auth.onAuthStateChanged((user) => {
            if (user) {
                loginSection.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;

                // Initialize Admin Map & Data
                initAdminDashboard();
            } else {
                appContainer.classList.add('hidden');
                loginSection.classList.remove('hidden');
            }
        });

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'چاوەڕێ بکە...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                loginAlert.textContent = 'ئیمێڵ یان تێپەڕەواشە هەڵەیە!';
                loginAlert.classList.remove('hidden');
                loginAlert.className = 'p-4 rounded-xl text-sm font-medium bg-red-50 text-red-600';
                submitBtn.disabled = false;
                submitBtn.textContent = 'چوونەژوورەوە';
            }
        });

        // Proper Logout Handler
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.reload(); // بۆ دڵنیابوون لە خاوێنکردنەوەی سێشنەکە
            });
        });

        // Admin Dashboard & Live Map Logic
        function initAdminDashboard() {
            if (!map) {
                map = L.map('map').setView([36.1912, 44.0091], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            }

            // Realtime listener for checkins / locations
            db.collection('checkins').onSnapshot((snapshot) => {
                studentListContainer.innerHTML = '';
                let count = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const uid = doc.id;

                    // ئەگەر ئەکاونتی ئەدمین خۆی بوو لە لیستەکە لێی گەڕێ
                    if (data.email && data.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) return;

                    count++;
                    const isOnline = data.isOnline ?? false;
                    const timeStr = data.lastLocationUpdate ? new Date(data.lastLocationUpdate.toDate()).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}) : 'نادیار';

                    // Render in sidebar list
                    const card = document.createElement('div');
                    card.className = "p-3 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-between text-xs";
                    card.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800 dir-ltr text-right">${data.email || 'قوتابی'}</p>
                            <p class="text-slate-400 mt-0.5">نوێترین لۆکەیشن: ${timeStr}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-lg font-bold ${isOnline ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                            ${isOnline ? '🟢 ئۆنلاین' : '⚪ ئۆفلاین'}
                        </span>
                    `;
                    studentListContainer.appendChild(card);

                    // Render / Update Marker on Map
                    if (data.location) {
                        const lat = data.location.latitude;
                        const lng = data.location.longitude;
                        const latlng = [lat, lng];

                        if (markersMap[uid]) {
                            markersMap[uid].setLatLng(latlng);
                            markersMap[uid].setPopupContent(`<b>${data.email}</b><br>کاتی نوێکردنەوە: ${timeStr}`);
                        } else {
                            markersMap[uid] = L.marker(latlng).addTo(map)
                                .bindPopup(`<b>${data.email}</b><br>کاتی نوێکردنەوە: ${timeStr}`);
                        }
                    }
                });

                studentCount.textContent = count;
                if (count === 0) {
                    studentListContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">هیچ قوتابییەک لۆکەیشنی نەناردووە.</p>`;
                }
            });
        }
    </script>
</body>
</html>
