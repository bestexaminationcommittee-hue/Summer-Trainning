<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆمارکردنی ئامادەبوون</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Header / User Info -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xl">
                    🎓
                </div>
                <div>
                    <h2 class="font-bold text-slate-800 text-lg" id="userDisplayName">به‌خێربێیت</h2>
                    <p class="text-xs text-slate-400" id="userEmail">باردەکرێت...</p>
                </div>
            </div>
            <button id="logoutBtn" class="px-4 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition">
                چوونەدەرەوە
            </button>
        </div>

        <!-- Checkin Card -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100 text-center space-y-6">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800">تۆمارکردنی ئامادەبوون</h1>
                <p class="text-slate-500 text-sm mt-1">تکایە دوگمەی خوارەوە داگرە بۆ تۆمارکردنی ئامادەبوونی ئەمڕۆت</p>
            </div>

            <!-- Status Alert -->
            <div id="statusBox" class="hidden p-4 rounded-2xl text-sm font-semibold transition-all duration-300"></div>

            <button 
                id="checkinBtn"
                class="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-emerald-200 transition duration-200 transform active:scale-95 flex items-center justify-center space-x-2 space-x-reverse"
            >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span>تۆمارکردنی ئامادەبوون</span>
            </button>
        </div>

    </div>

    <script>
        // کلیلە ڕاستەقینەکانی فایەربەیزی خۆت
        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOxm78zILvHZ9tA8fhpbHH0mpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034578",
            appId: "1:1064679034578:web:f334161e9e6a2b11a6ee33"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const userDisplayName = document.getElementById('userDisplayName');
        const userEmail = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const checkinBtn = document.getElementById('checkinBtn');
        const statusBox = document.getElementById('statusBox');

        // پێداچوونەوەی باری چوونەژوورەوە
        auth.onAuthStateChanged((user) => {
            if (user) {
                const username = user.email.split('@')[0];
                userDisplayName.innerText = `بەخێربێیت، ${username}`;
                userEmail.innerText = user.email;
            } else {
                // ئەگەر لۆگین نەبووبوو، بگەڕێتەوە بۆ لۆگین
                window.location.href = 'login.html';
            }
        });

        // کلیک لەسەر تۆمارکردنی ئامادەبوون
        checkinBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            checkinBtn.disabled = true;
            checkinBtn.innerText = 'تۆمار دەکرێت...';

            try {
                const today = new Date().toISOString().split('T')[0];
                
                await db.collection('attendances').add({
                    uid: user.uid,
                    email: user.email,
                    date: today,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showStatus('ئامادەبوونی ئەمڕۆت بە سەرکەوتوویی تۆمارکرا! 🎉', 'bg-emerald-50 text-emerald-700 border border-emerald-200');
                checkinBtn.innerText = 'ئامادەبوون تۆمارکرا✓';
                checkinBtn.className = "w-full py-4 px-6 bg-slate-200 text-slate-500 font-bold text-lg rounded-2xl cursor-not-allowed";

            } catch (error) {
                console.error("Firestore Error:", error);
                showStatus('خەتا لە تۆمارکردن دروستبوو، تکایە دواتر تاقی بکەرەوە.', 'bg-rose-50 text-rose-700 border border-rose-200');
                checkinBtn.disabled = false;
                checkinBtn.innerText = 'تۆمارکردنی ئامادەبوون';
            }
        });

        // چوونەدەرەوە
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        });

        function showStatus(msg, classes) {
            statusBox.className = `p-4 rounded-2xl text-sm font-semibold transition-all duration-300 ${classes}`;
            statusBox.innerText = msg;
            statusBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
