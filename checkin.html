<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی پشکنینی ئامادەبوونی قوتابیان</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
                    🎓
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-none">سیستەمی قوتابیان</h1>
                    <span class="text-xs text-slate-500">تۆمارکردنی ئامادەبوون</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <span id="userEmailDisplay" class="text-sm font-medium text-slate-600 dir-ltr"></span>
                <button id="logoutBtn" class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition">
                    دەقەوتانبوون / دەرچوون
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Status / Welcome Card -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h2 class="text-xl font-bold text-slate-800 mb-1">بەخێربێیت بۆ بەشی پشکنین</h2>
                <p class="text-sm text-slate-500">لە ڕێگەی ئەم لاپەڕەیەوە دەتوانیت بارودۆخی ئامادەبوون تۆمار بکەیت.</p>
            </div>
            <div id="statusBadge" class="px-4 py-2 rounded-xl text-sm font-bold bg-indigo-50 text-indigo-700">
                سیستەم ئامادەیە
            </div>
        </div>

        <!-- Alert Message Box -->
        <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

    </main>

    <script>
        // کلیلە ڕاستەقینەکانی فایەربەیسەکەت
        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOXm78zILvHZ9tA8fphHHOmpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034578",
            appId: "1:1064679034578:web:f334161e9e6a2b11a6ee33"
        };

        // پێناسەکردنی فایەربەیس
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, isError = true) {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (isError) {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-600');
            }
        }

        // پشکنینی باری چوونه‌ژووره‌وه‌ی بهۆکار
        auth.onAuthStateChanged((user) => {
            if (user) {
                // بەکارهێنەر لۆگینە
                userEmailDisplay.textContent = user.email;
            } else {
                // ئەگەر بەکارهێنەر لۆگین نەبووبێت، بیباتەوە بۆ login.html
                window.location.href = "login.html";
            }
        });

        // دوگمەی دەرچوون (Logout)
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                showAlert('کێشەیەک ڕوویدا لە کاتی دەرچووندا!', true);
            });
        });
    </script>
</body>
</html>
