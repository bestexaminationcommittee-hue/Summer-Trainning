<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی قوتابیان - چوونەژوورەوە</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800">سیستەمی قوتابیان</h1>
            <p class="text-sm text-slate-500">تکایە ئیمێڵ و پاسۆردەکەت بنووسە</p>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">ئیمێڵ (Email)</label>
                <input type="email" id="email" required placeholder="muhammed@best.com" dir="ltr"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-left">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">تێپەڕەواشە (Password)</label>
                <input type="password" id="password" required placeholder="••••••••" dir="ltr"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-left">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-indigo-100 flex items-center justify-center space-x-2 space-x-reverse">
                <span>چوونەژوورەوە</span>
            </button>
        </form>
    </div>

    <script>
        // کلیلە ڕاستەقینەکانی فایەربەیسەکەت
        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOXm78zILvHZ9tA8fphHHOmpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034578",
            appId: "1:1064679034578:web:f334161e9e6a2b11a6ee33"
        };

        // پێناسەکردنی فایەربەیس
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, isError = true) {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (isError) {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-600');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>تکایە چاوەڕێ بکە...</span>';

            try {
                // چوونەژوورەوە بە ئیمێڵ و پاسۆرد
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                
                showAlert('چوونەژوورەوە بەسەرکەوتوویی ئەنجامدرا!', false);
                
                // ناردن بۆ پەیجی دواتر دوای ١ چڕکە
                setTimeout(() => {
                    window.location.href = "index.html"; // یان ناوی ئەو پەیجەی دوای لۆگین دێت
                }, 1000);

            } catch (error) {
                console.error("Firebase Auth Error:", error);
                
                let errorMessage = 'ئیمێڵ یان تێپەڕەواشە هەڵەیە!';
                if (error.code === 'auth/invalid-email') {
                    errorMessage = 'تکایە ئیمێڵێکی دروست بنووسە!';
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage = 'ئەم ئیمێڵە لە سیستەمەکەدا بوونی نییە!';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'تێپەڕەواشەکە هەڵەیە!';
                } else if (error.code === 'auth/invalid-credential') {
                    errorMessage = 'ئیمێڵ یان پاسۆرد هەڵەیە!';
                }

                showAlert(errorMessage, true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>چوونەژوورەوە</span>';
            }
        });
    </script>
</body>
</html>
