<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوەی قوتابی</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800">سیستەمی قوتابیان</h1>
            <p class="text-sm text-slate-5-0 text-slate-500">تکایە ناوی بەکارهێنەر و پاسۆردەکەت بنووسە</p>
        </div>

        <!-- Alert Message Container -->
        <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-semibold transition-all duration-300 text-center"></div>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">ناوی بەکارهێنەر (Username)</label>
                <input 
                    type="text" 
                    id="username" 
                    required 
                    placeholder="نموونە: student1"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-left dir-ltr"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">تێپەڕەواشە (Password)</label>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-left dir-ltr"
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition duration-200 flex items-center justify-center"
            >
                <span>چوونەژوورەوە</span>
            </button>

        </form>

    </div>

    <script>
        // کلیلە ڕاستەقینەکانی فایەربەیزی خۆت
        const firebaseConfig = {
            apiKey: "AIzaSyDRJHRXsrOxm78zILvHZ9tA8fhpbHH0mpA",
            authDomain: "summer-trainimg.firebaseapp.com",
            projectId: "summer-trainimg",
            storageBucket: "summer-trainimg.firebasestorage.app",
            messagingSenderId: "1064679034578",
            appId: "1:1064679034578:web:f334161e9e6a2b11a6ee33"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // ئەگەر ئیمێڵی تێنەنوسیبوو، خۆکارانە دامێنەکەی بۆ زیاد دەکات
            const email = username.includes('@') ? username : `${username}@institute.com`;

            // هەنگاوی بارکردن
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>تکایە چاوەڕێ بکە...</span>`;
            showAlert('', 'hidden');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showAlert('بە سەرکەوتوویی چوویەتە ژوورەوە! ڕەوانە دەکرێیت...', 'bg-emerald-50 text-emerald-700 border border-emerald-200');
                
                setTimeout(() => {
                    window.location.href = 'checkin.html';
                }, 1200);

            } catch (error) {
                console.error("Login Error:", error);
                let message = 'ناونیشان یان تێپەڕەواشە هەڵەیە!';
                
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    message = 'ناوی بەکارهێنەر یان پاسۆرد هەڵەیە!';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'هەوڵدانی زۆر! تکایە دواتر تاقی بکەرەوە.';
                }

                showAlert(message, 'bg-rose-50 text-rose-700 border border-rose-200');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>چوونەژوورەوە</span>`;
            }
        });

        function showAlert(msg, classes) {
            alertBox.className = `p-4 rounded-xl text-sm font-semibold text-center transition-all duration-300 ${classes}`;
            alertBox.innerText = msg;
        }
    </script>
</body>
</html>
